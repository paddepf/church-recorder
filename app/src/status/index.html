<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101419" />
  <title>Ebbton – Status</title>
  <link rel="stylesheet" href="status.css" />
</head>
<body>
  <main id="app">
    <header>
      <span class="brand">Ebbton</span>
      <span id="conn" class="conn" data-state="off">getrennt</span>
    </header>

    <form id="login" hidden>
      <label>Passwort zum Mitlesen
        <input id="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Verbinden</button>
      <p id="login-error" class="error" hidden></p>
    </form>

    <section id="status" hidden>
      <div id="service" class="service"></div>
      <div id="state" class="state" data-status="idle">
        <span class="dot"></span><span id="state-text">Bereit</span>
      </div>
      <div id="timer" class="timer">0:00:00</div>
      <div class="meter" aria-hidden="true"><span><i id="meter-l"></i></span><span><i id="meter-r"></i></span></div>

      <div id="alerts" class="alerts"></div>

      <div class="card">
        <div class="label">Jetzt</div>
        <div id="current" class="current">–</div>
        <div id="current-time" class="sub"></div>
      </div>
      <div class="card">
        <div class="label">Als Nächstes</div>
        <div id="next" class="next">–</div>
      </div>
      <ol id="sections" class="sections"></ol>
    </section>
  </main>
  <script src="status.js"></script>
</body>
</html>
