name: Tests

# Läuft bei jedem Push und Pull Request – auf Windows und macOS, weil die App auf beiden
# Rechnern (Kirchen-PC und MacBook) laufen muss.
on:
  push:
    branches: ['**']
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci
        env:
          # Für die Tests wird Electron selbst nicht gebraucht.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Tests
        run: npm test
